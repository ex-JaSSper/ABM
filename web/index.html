<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ABM · движок следующего действия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#f5f7f3; --paper-2:#ecefe8; --card:#ffffff; --well:#eff2ea;
  --ink:#1f2a24; --ink-2:#586158; --ink-3:#8b968c; --line:#e7ebe2; --line-2:#dbe0d4;
  --blueprint:#3e8062; --blueprint-2:#336a51; --blueprint-3:#9cc2ae; --blueprint-wash:#e9f1ec;
  --brass:#b0894a; --brass-2:#c39c58; --brass-wash:#f2ecdd;
  --signal:#c2664e; --signal-wash:#f5e5df;
  --teal:#3f7d74; --teal-2:#52968c; --teal-wash:#e7f0ee;
  --moss:#4f8557; --moss-wash:#e9f1e7;
  --f-display:'Manrope',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-sans:'Manrope',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-mono:'Manrope',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

.eyebrow{font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.display{font-family:var(--f-display);letter-spacing:-.015em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

.app{display:flex;height:100vh;overflow:hidden}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(circle at 50% 20%,#fff 0,var(--paper) 48%,var(--paper-2) 100%)}
.auth-card{width:min(440px,100%);padding:2rem;border-radius:14px;text-align:center}
.auth-card .brand-badge{margin:0 auto 1rem;width:54px;height:54px;font-size:1.35rem}
.auth-card h1{font-size:1.5rem;margin-top:.25rem}
.auth-card p{font-size:.86rem;line-height:1.55;margin:.65rem 0 1.25rem}
.auth-telegram{width:100%;justify-content:center;padding:.72rem 1rem;background:#229ed9;color:#fff;border-radius:8px}
.auth-telegram:hover{background:#1689c1}
.auth-note{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.72rem;line-height:1.5;color:var(--ink-3)}
.auth-user{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.7rem;padding-top:.65rem;border-top:1px solid var(--line);font-size:.72rem}
.sidebar{width:262px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.6rem;padding:1.15rem 1.15rem}
.brand-badge{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:linear-gradient(150deg,var(--blueprint),var(--blueprint-3))}
.brand b{font-family:var(--f-display);font-size:.9rem;display:block;line-height:1.1}
.nav{flex:1;padding:.4rem .6rem;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:4px;font-size:.85rem;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.nav a:hover{background:var(--well)}
.nav a.active{background:var(--brass-wash);color:#7a5417}
.nav a .ico{width:16px;text-align:center;opacity:.9}
.nav a .grow{flex:1}
.nav-badge{font-family:var(--f-mono);font-size:.7rem;font-weight:600;background:var(--blueprint);color:var(--paper);border-radius:3px;padding:.05rem .4rem}
.sidebar-warn{margin:.4rem .7rem;padding:.5rem .65rem;border-radius:4px;background:var(--signal-wash);color:#9d3013;font-size:.75rem;display:flex;align-items:center;gap:.4rem;text-decoration:none}
.sidebar-warn:hover{background:#f4d0c4}
.sidebar-foot{border-top:1px solid var(--line);padding:.75rem 1rem}
.main{flex:1;overflow-y:auto}
.main-inner{max-width:1200px;margin:0 auto;padding:1.6rem 2rem 3rem}
.main-inner:has(.crm-page){max-width:1580px}

.drafting{background-color:var(--paper);background-image:linear-gradient(rgba(22,35,44,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(22,35,44,.035) 1px,transparent 1px);background-size:28px 28px}

.page-head{border-bottom:1px solid var(--line);padding-bottom:1.1rem;margin-bottom:1.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem}
.page-head h1{font-family:var(--f-display);font-size:1.75rem;font-weight:700;margin-top:.35rem}

.panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 rgba(22,35,44,.04),0 12px 28px -22px rgba(16,43,60,.5)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem 1.15rem;border-bottom:1px solid var(--line)}
.panel-title{font-family:var(--f-display);font-weight:600;font-size:.9rem;letter-spacing:-.01em}

.grid{display:grid;gap:1.1rem}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.span2{grid-column:auto}}
.stack>*+*{margin-top:1.1rem}

.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:3px;font-weight:600;font-size:.82rem;font-family:var(--f-sans);line-height:1;padding:.55rem .9rem;border:1px solid transparent;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blueprint);color:var(--paper)} .btn-primary:hover{background:var(--blueprint-2)}
.btn-brass{background:var(--brass);color:#fff} .btn-brass:hover{background:var(--brass-2)}
.btn-signal{background:var(--signal);color:#fff} .btn-signal:hover{background:#b93f23}
.btn-moss{background:var(--moss);color:#fff} .btn-moss:hover{background:#46662a}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)} .btn-ghost:hover{background:var(--well);color:var(--ink)}
.btn-sm{padding:.38rem .65rem;font-size:.75rem}
.btn-xs{padding:.2rem .45rem;font-size:.72rem}
.btn-block{width:100%;justify-content:center}

.field{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:3px;padding:.5rem .65rem;font-size:.85rem;font-family:var(--f-sans);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-wash)}
select.field{cursor:pointer}
.field.auto{width:auto}
.field.sm{padding:.35rem .5rem;font-size:.78rem}
label.lbl{display:block;margin-bottom:.35rem}

.chip{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.02em;padding:.15rem .45rem;border-radius:2px;border:1px solid transparent;white-space:nowrap}
.chip-neutral{background:var(--well);color:var(--ink-2);border-color:var(--line-2)}
.chip-signal{background:var(--signal-wash);color:var(--signal);border-color:rgba(207,75,44,.3)}
.chip-blueprint{background:rgba(16,43,60,.08);color:var(--blueprint);border-color:rgba(16,43,60,.2)}
.chip-brasssoft{background:var(--brass-wash);color:#8a611c;border-color:rgba(185,130,42,.3)}
.chip-brass{background:var(--brass);color:#fff}
.chip-moss{background:var(--moss);color:#fff}
.chip-mosssoft{background:var(--moss-wash);color:#3f5a25;border-color:rgba(86,122,52,.3)}
.chip-teal{background:var(--teal-wash);color:var(--teal);border-color:rgba(43,111,110,.3)}
.chip-ink{background:rgba(22,35,44,.08);color:var(--ink-3);border-color:var(--line-2)}
.prio{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border:0;background:transparent!important;border-radius:0!important;font-family:var(--f-sans);font-size:1.05rem;font-weight:800;line-height:1;flex-shrink:0}
.prio svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prio-A{color:#e2554f} .prio-B{color:#d1912b} .prio-C{color:#3294c8}

table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400;text-align:left;padding:.7rem .75rem;border-bottom:1px solid var(--line)}
tbody td{padding:.7rem .75rem;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr.hoverable:hover{background:rgba(239,236,226,.5)}
.tl{padding-left:1.15rem!important} .tr{padding-right:1.15rem!important;text-align:right}
.link:hover{color:var(--brass)}

.tile{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.9rem 1.05rem;box-shadow:0 1px 0 rgba(22,35,44,.04)}
.tile .val{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;margin-top:.25rem;line-height:1}
.tile .hint{font-size:.72rem;color:var(--ink-3);margin-top:.35rem}
.tile.click{cursor:pointer;transition:box-shadow .15s,transform .05s}
.tile.click:hover{box-shadow:0 8px 22px -16px rgba(16,43,60,.6)}
.c-brass{color:var(--brass)} .c-blueprint{color:var(--blueprint)} .c-signal{color:var(--signal)} .c-teal{color:var(--teal)} .c-moss{color:var(--moss)} .c-ink3{color:var(--ink-3)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.metrics>div{background:var(--card);padding:.7rem .9rem}
.metrics .m-val{font-family:var(--f-mono);font-size:1.15rem;font-weight:600}
.metrics .m-lbl{font-size:.72rem;color:var(--ink-3)}

.pct{font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:.1rem .35rem;border-radius:2px}
.pct-hi{background:var(--moss-wash);color:#3f5a25}
.pct-mid{background:var(--brass-wash);color:#8a611c}
.pct-lo{background:var(--signal-wash);color:var(--signal)}

.funnel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:1.15rem}
.funnel .rung{height:46px;border-radius:3px;display:flex;align-items:center;justify-content:space-between;padding:0 .8rem;color:#fff;min-width:90px;box-shadow:0 2px 6px -3px rgba(16,43,60,.5)}
.funnel .rung .rl{font-size:.78rem;font-weight:500}
.funnel .rung .rv{font-family:var(--f-mono);font-weight:600;font-size:.95rem}

.bar{height:8px;width:100%;background:var(--well);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.bar.complete{background:var(--moss-wash);box-shadow:0 0 0 2px rgba(93,126,55,.06)}
.bar.complete>i{background:var(--moss)}

.focus-body{position:relative;padding-left:1.15rem}
.focus-rail{position:absolute;left:26px;top:14px;bottom:34px;width:2px;background:linear-gradient(var(--brass-2),var(--brass));border-radius:2px}
.focus-rail::after{content:'';position:absolute;left:50%;bottom:-16px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:linear-gradient(135deg,var(--brass-2),var(--brass));border-radius:2px;box-shadow:0 3px 6px -2px rgba(16,43,60,.5)}
.focus-item{position:relative;display:flex;align-items:center;gap:.75rem;padding:.7rem 1.15rem .7rem 2.6rem;border-bottom:1px solid var(--line)}
.focus-item:last-child{border-bottom:none}
.focus-node{position:absolute;left:21px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--brass)}
.beacon{position:relative;display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--signal)}
.beacon::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--signal);animation:bp 1.8s ease-out infinite}
@keyframes bp{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}

.sigcard{display:flex;flex-direction:column;padding:1.15rem}
.field-row{margin-top:.6rem}
.field-row dt{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field-row dd{margin:.1rem 0 0;font-size:.85rem;color:var(--ink)}

.dossier{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;padding:1.15rem}
@media(max-width:700px){.dossier{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}

.tabs{display:flex;gap:.35rem;border-bottom:1px solid var(--line);padding:0 .4rem;flex-wrap:wrap}
.tabs button{background:none;border:none;cursor:pointer;font-family:var(--f-sans);font-size:.85rem;font-weight:600;color:var(--ink-3);padding:.7rem .9rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
.tabs .cnt{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);margin-left:.3rem}

.lpr{display:flex;align-items:center;gap:.9rem;padding:.85rem 1.15rem;border-bottom:1px solid var(--line)}
.lpr:last-child{border-bottom:none}
.lpr.excluded{opacity:.55}
.lpr .av{width:34px;height:34px;border-radius:50%;background:var(--well);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;color:var(--ink-2);flex-shrink:0}
.count{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);background:var(--well);border:1px solid var(--line);border-radius:2px;padding:.1rem .4rem}

.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(16,43,60,.45);backdrop-filter:blur(2px)}
.modal{width:100%;max-width:660px;padding:1.5rem;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:.75rem;margin-bottom:1.1rem}
.modal-head h3{font-family:var(--f-display);font-size:1rem;font-weight:600;padding-right:1rem}
.x{background:none;border:none;cursor:pointer;color:var(--ink-3);font-size:1rem;flex-shrink:0}
.seg{display:flex;gap:.35rem;background:var(--well);padding:.25rem;border-radius:4px}
.seg button{flex:1;border:none;background:none;cursor:pointer;padding:.45rem;border-radius:3px;font-size:.82rem;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.next{color:var(--blueprint)} .seg button.on.exc{color:var(--signal)}
.seg-mini{width:auto;padding:.15rem}
.seg-mini button{flex:none;padding:.3rem .7rem;font-size:.75rem}
.seg-mini button.on{color:var(--blueprint)}
.mrow{margin-top:.7rem}

.hyp-head{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:start;padding:1.15rem;background:linear-gradient(180deg,rgba(217,235,233,.35),transparent)}
.smart{font-size:.8rem;color:var(--ink-2);background:var(--well);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:3px;padding:.6rem .75rem;margin-top:.5rem;line-height:1.45}
.hyp-status{position:relative;text-align:left;min-width:142px}
.hyp-status summary{list-style:none;display:flex;align-items:center;gap:.48rem;width:100%;padding:.42rem .55rem;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--ink-2);font-size:.76rem;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,45,.04);transition:border-color .15s,box-shadow .15s,background .15s}
.hyp-status summary::-webkit-details-marker{display:none}
.hyp-status summary::after{content:'⌄';margin-left:auto;color:var(--ink-3);font-size:.72rem}
.hyp-status[open] summary{border-color:var(--blueprint-3);box-shadow:0 0 0 3px var(--blueprint-wash)}
.hyp-status-menu{position:absolute;z-index:40;top:calc(100% + 6px);right:0;width:190px;padding:.35rem;background:var(--card);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 38px -18px rgba(20,30,45,.45)}
.hyp-status-option{display:flex;align-items:center;gap:.52rem;width:100%;border:0;border-radius:7px;background:transparent;padding:.5rem .55rem;color:var(--ink-2);font:600 .76rem/1 var(--f-sans);text-align:left;cursor:pointer}
.hyp-status-option:hover{background:var(--well);color:var(--ink)}
.hyp-status-option.on{background:var(--blueprint-wash);color:var(--blueprint)}
.hyp-status-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--ink-3)}
.hyp-status-idea .hyp-status-dot{background:var(--ink-3)}
.hyp-status-in_work .hyp-status-dot{background:var(--blueprint)}
.hyp-status-validated .hyp-status-dot{background:var(--moss)}
.hyp-status-paused .hyp-status-dot{background:var(--brass)}
.hyp-status-rejected .hyp-status-dot{background:var(--signal)}
.hyp-status-archived .hyp-status-dot{background:#727b75}
.exp{display:inline-flex;width:18px;justify-content:center;color:var(--ink-3);cursor:pointer;user-select:none}
.subrow td{background:var(--well);padding:.6rem 1.15rem .8rem 2.3rem!important}
.subwrap{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.subchip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .5rem;border-radius:2px;font-size:.72rem;cursor:pointer;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);transition:border-color .15s,background .15s}
.subchip:hover{border-color:var(--teal)}
.subchip.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.subchip .del{opacity:.5;margin-left:.15rem}
.subchip .del:hover{opacity:1;color:var(--signal)}
.contrib{font-size:.78rem;color:var(--ink-2);padding:.15rem 0}
.contrib b{color:var(--moss)}
.tag-auto{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:var(--teal-wash);border-radius:2px;padding:.05rem .3rem}
.tinyadd{border:1px dashed var(--line-2);background:transparent;color:var(--ink-3);border-radius:2px;padding:.25rem .5rem;font-size:.72rem;cursor:pointer}
.tinyadd:hover{border-color:var(--teal);color:var(--teal)}

.warn-banner{border:1px solid rgba(207,75,44,.35);background:var(--signal-wash);color:#9d3013;padding:.7rem .9rem;border-radius:4px;font-size:.83rem}
.info-banner{border:1px solid var(--line);background:var(--well);padding:.7rem .9rem;border-radius:4px;font-size:.82rem;color:var(--ink-2)}
.rowflex{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.75rem}
.end{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.1rem;border-top:1px solid var(--line);padding-top:1rem}
.strat-field{margin-top:1.2rem}
.strategy-editable{position:relative;min-height:42px;padding:.62rem .72rem;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);font-size:.88rem;line-height:1.5;white-space:pre-wrap;cursor:text;transition:background .15s,border-color .15s,box-shadow .15s}
.strategy-editable:hover{background:var(--blueprint-wash);border-color:var(--blueprint-3);box-shadow:0 0 0 3px rgba(55,111,148,.05)}
.strategy-editable::after{content:'Двойной клик для редактирования';position:absolute;right:.6rem;top:.45rem;padding:.12rem .35rem;border-radius:5px;background:var(--card);color:var(--ink-3);font-size:.6rem;font-weight:600;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .15s}
.strategy-editable:hover::after{opacity:1}
.strategy-editable.editing{padding:0;border-color:transparent;background:transparent;box-shadow:none}
.strategy-editable.editing::after{display:none}
.strategy-editable .field{margin:0}
.strategy-editable.compact{display:inline-flex;align-items:center;justify-content:flex-end;min-width:116px;min-height:38px;padding:.45rem .65rem;text-align:right;font-family:var(--f-mono)}
.strategy-editable.compact::after{display:none}
.strategy-editable.empty{color:var(--ink-3);font-style:italic}

function contactCat(s,cid){
  const done=s.tasks.filter(t=>isActivity(t)&&t.contact_id===cid);
  if(done.some(t=>TASK_TYPE_META[t.type].cat==='agreement'))return 3;
  if(done.some(t=>TASK_TYPE_META[t.type].cat==='meeting'))return 2;
  if(done.some(t=>TASK_TYPE_META[t.type].cat==='touch'))return 1;
  return 0;
}
function averages(s){
  const doneTouch=s.tasks.filter(t=>isActivity(t)&&TASK_TYPE_META[t.type]?.cat==='touch');
  const doneMeet =s.tasks.filter(t=>isActivity(t)&&TASK_TYPE_META[t.type]?.cat==='meeting');
  const engagedCompanies=s.companies.filter(c=>rank(c.funnel_stage)>=rank('in_work')).length||1;
  const engagedContacts=new Set(doneTouch.concat(doneMeet).map(t=>t.contact_id).filter(Boolean)).size||1;
  return {touchPerCompany:doneTouch.length/engagedCompanies,meetPerCompany:doneMeet.length/engagedCompanies,
    touchPerContact:doneTouch.length/engagedContacts,meetPerContact:doneMeet.length/engagedContacts};
}
function companyFunnel(s){
  const active=s.companies.filter(c=>c.funnel_stage!=='rejected'&&!c.is_excluded);
  const acted=cat=>new Set(s.tasks.filter(t=>isActivity(t)&&TASK_TYPE_META[t.type]?.cat===cat).map(t=>t.company_id).filter(Boolean)).size;
  const analyzed=new Set(s.tasks.filter(t=>t.type==='analyze_signal'&&t.status==='done').map(t=>t.company_id)).size;
  return [{label:'Выгружено',value:s.companies.length},{label:'В разбор',value:analyzed},
    {label:'Касание',value:acted('touch')},{label:'Встреча',value:acted('meeting')},
    {label:'Выручка',value:active.filter(c=>c.funnel_stage==='revenue').length}];
}
function contactFunnel(s){
  const matched=s.contacts.filter(k=>k.company_id!==null);
  const cats=matched.map(k=>contactCat(s,k.id));
  const ge=n=>cats.filter(r=>r>=n).length;
  return [{label:'Контакты',value:matched.length},{label:'Касание',value:ge(1)},
    {label:'Встреча',value:ge(2)},{label:'Договорённость',value:ge(3)}];
}

function contactActionCount(s,kid,cat){return s.tasks.filter(t=>isActivity(t)&&t.contact_id===kid&&TASK_TYPE_META[t.type]?.cat===cat).length;}
const LEGACY_CRM_STAGE={touch1:'touch',touch2:'touch',meeting1:'meeting',meeting2:'meeting'};
function contactStage(s,k){const st=LEGACY_CRM_STAGE[k.crm_stage]||k.crm_stage;return CRM_COL(st)?st:'signal';}

function focus(s){
  const now=NOW.getTime();
  return s.companies.filter(isActive).map(c=>{
    const deferredContacts=s.contacts.filter(k=>k.company_id===c.id&&k.status==='active'&&contactStage(s,k)==='deferred');
    const idle=Math.max(0,Math.floor((now-new Date(c.last_activity_at).getTime())/DAY));
    const stalled=deferredContacts.length>0;
    return {company:c,deferredContacts,stalled,idleDays:idle,priority:(STAGE_WEIGHT[c.funnel_stage]||1)*(idle+1)};
  }).sort((a,b)=>a.stalled!==b.stalled?(a.stalled?-1:1):b.priority-a.priority);
}
function htContrib(s,ht){return s.tasks.filter(t=>isActivity(t)&&t.hyp_task_id===ht.id&&TASK_TYPE_META[t.type]?.cat===ht.track);}
function htSubs(s,ht){return allSubs(s).filter(x=>x.hyp_task_id===ht.id);}
function htFact(s,ht){if(ht.mode!=='tracked')return htSubs(s,ht).filter(x=>x.is_done).length;const rows=htContrib(s,ht);if(ht.aggregation_mode==='contacts')return new Set(rows.map(x=>x.contact_id).filter(Boolean)).size;if(ht.aggregation_mode==='companies')return new Set(rows.map(x=>x.company_id).filter(Boolean)).size;return rows.length;}
function htPlan(s,ht){return ht.mode==='tracked'?ht.plan:Math.max(htSubs(s,ht).length,0);}
function htStatusEffective(s,ht){const f=htFact(s,ht),p=htPlan(s,ht);if(p>0&&f>=p)return 'done';return f>0?'in_work':'planned';}
function hypProgress(s,h){
  const ts=allHtasks(s).filter(t=>t.hypothesis_id===h.id);
  if(!ts.length)return 0;
  return ts.reduce((a,t)=>{const p=htPlan(s,t);return a+(p>0?Math.min(1,htFact(s,t)/p):0);},0)/ts.length;
}

// ---- запись: полная синхронизация состояния в базу (upsert + удаление исчезнувших) ----
const COLS={
  strategy:['id','name','quarter','description','expected_effect','created_at'],
  kpi_target:['id','strategy_id','kpi_key','unit','plan_value','prev_q_value'],
  hypothesis:['id','strategy_id','code','title','smart','status','priority','unit','plan','created_at'],

  board_task:['id','strategy_id','hypothesis_id','hyp_task_id','title','status','due_at','created_at','completed_at'],

};
function applyDbCapabilities(){
  if(DB_CAPS.inn&&!COLS.company.includes('inn'))COLS.company.splice(3,0,'inn');
  if(DB_CAPS.crm_stage&&!COLS.contact.includes('crm_stage'))COLS.contact.push('crm_stage');
  if(DB_CAPS.cycle&&!COLS.company_task.includes('cycle'))COLS.company_task.push('cycle');
  if(DB_CAPS.company_flow)COLS.company.push(...['rejection_reason_id','rejection_comment','rejected_at','purge_at'].filter(x=>!COLS.company.includes(x)));
  if(DB_CAPS.contact_flow)COLS.contact.push(...['hypothesis_id','hyp_task_id','owner_name','max_stage'].filter(x=>!COLS.contact.includes(x)));
  if(DB_CAPS.contact_response&&!COLS.contact.includes('response_status'))COLS.contact.push('response_status');
  if(DB_CAPS.task_flow)COLS.company_task.push(...['record_kind','stage','start_at','started_at','actual_at','channel','owner_name'].filter(x=>!COLS.company_task.includes(x)));
  if(DB_CAPS.board_flow)COLS.board_task.push(...['start_at','started_at','owner_name'].filter(x=>!COLS.board_task.includes(x)));
  if(DB_CAPS.board_priority&&!COLS.board_task.includes('priority'))COLS.board_task.push('priority');
  if(DB_CAPS.hyp_aggregation&&!COLS.hyp_task.includes('aggregation_mode'))COLS.hyp_task.push('aggregation_mode');
}
const pick=(o,keys)=>{const r={};keys.forEach(k=>{if(o[k]!==undefined)r[k]=o[k];});return r;};
function collectRows(s){
  const R={strategy:[],kpi_target:[],hypothesis:[],hyp_task:[],hyp_subtask:[],company:[],contact:[],company_task:[],board_task:[],rejection_reason:[]};
  s.strategies.forEach(st=>{
    R.strategy.push(pick(st,COLS.strategy));
    st.kpiTargets.forEach(k=>R.kpi_target.push(pick({...k,strategy_id:st.id},COLS.kpi_target)));
    st.hypotheses.forEach(h=>R.hypothesis.push(pick({...h,strategy_id:st.id},COLS.hypothesis)));
    st.hypTasks.forEach(t=>R.hyp_task.push(pick(t,COLS.hyp_task)));
    st.hypSubtasks.forEach(x=>R.hyp_subtask.push(pick(x,COLS.hyp_subtask)));
  });
  s.companies.forEach(c=>{const r=pick(c,COLS.company);if(r.ext_no==='')r.ext_no=null;R.company.push(r);});
  s.contacts.forEach(k=>R.contact.push(pick(k,COLS.contact)));
  s.tasks.forEach(t=>R.company_task.push(pick(t,COLS.company_task)));
  if(DB_CAPS.board_task)(s.boardTasks||[]).forEach(t=>R.board_task.push(pick(t,COLS.board_task)));
  if(DB_CAPS.rejection_reason)(s.rejectionReasons||[]).forEach(r=>R.rejection_reason.push(pick(r,COLS.rejection_reason)));
  return R;
}
let _dbIds={};
function refreshDbIds(s){const R=collectRows(s);_dbIds={};for(const t in R)_dbIds[t]=new Set(R[t].map(x=>x.id));}
async function pushAll(){
  const R=collectRows(App.state);
  const upOrder=['strategy','rejection_reason','company','hypothesis','contact','hyp_task','hyp_subtask','kpi_target','company_task','board_task'];
  for(const t of upOrder){if(t==='board_task'&&!DB_CAPS.board_task)continue;if(t==='rejection_reason'&&!DB_CAPS.rejection_reason)continue;if(R[t].length){const {error}=await sb.from(t).upsert(R[t]);if(error)throw error;}}
  const delOrder=['board_task','company_task','kpi_target','hyp_subtask','hyp_task','hypothesis','contact','company','rejection_reason','strategy'];
  for(const t of delOrder){
    if(t==='board_task'&&!DB_CAPS.board_task)continue;if(t==='rejection_reason'&&!DB_CAPS.rejection_reason)continue;
    const cur=new Set(R[t].map(x=>x.id));const prev=_dbIds[t]||new Set();

const norm=x=>String(x==null?'':x).trim().toLowerCase().replace(/\s+/g,' ');
function rowGet(row,cands,opts){opts=opts||{};
  for(const key of Object.keys(row)){const nk=norm(key);
    for(const c of cands){if(opts.exact?nk===c:nk.includes(c)){if(opts.not&&opts.not.some(x=>nk.includes(x)))continue;const v=row[key];if(v!=='' && v!=null)return String(v).trim();}}}
  return '';
}

        linkedin: rowGet(row,['linkedin']), other_social: rowGet(row,['другие соц']), source: rowGet(row,['источник'])||'импорт',
        last_digital_trace: rowGet(row,['последний цифровой след','цифровой след']), last_trace_date: rowGet(row,['дата последнего следа']),

function parseCSV(text){
  const firstLine=text.split(/\r?\n/)[0]||''; const delim=(firstLine.split(';').length>firstLine.split(',').length)?';':',';
  const rows=[]; let i=0,field='',row=[],inQ=false;
  const pushF=()=>{row.push(field);field='';}; const pushR=()=>{rows.push(row);row=[];};
  while(i<text.length){const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
    else { if(ch==='"')inQ=true; else if(ch===delim)pushF(); else if(ch==='\n'){pushF();pushR();} else if(ch==='\r'){} else field+=ch; }
    i++;
  }
  if(field.length||row.length){pushF();pushR();}
  const header=rows.shift()||[]; return rows.filter(r=>r.some(x=>String(x).trim()!=='')).map(r=>{const o={};header.forEach((h,idx)=>{o[h]=r[idx]!=null?r[idx]:'';});return o;});
}
function handleExcelFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const fr=new FileReader();
  fr.onload=e=>{
    try{
      let rows=[];
      if(ext==='csv'){ rows=parseCSV(String(e.target.result)); }
      else{
        if(typeof XLSX==='undefined'){toast('Не загрузилась библиотека чтения Excel (нужен интернет). Сохраните как CSV.');return;}
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        wb.SheetNames.forEach(sn=>{ rows=rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''})); });
      }
      if(!rows.length){toast('Файл пустой или не распознан.');return;}
      importRows(rows);
    }catch(err){toast('Ошибка импорта: '+err.message);}
  };
  if(ext==='csv')fr.readAsText(file,'utf-8'); else fr.readAsArrayBuffer(file);
}

function tile(l,v,h,c,onclick){return `<div class="tile ${onclick?'click':''}" ${onclick?`onclick="${onclick}"`:''}><div class="eyebrow">${l}</div><div class="val ${c||''}">${v}</div><div class="hint">${h}</div></div>`;}
function mCell(l,v,money){return `<div><div class="m-val">${money?fmtM(v):fmtN(v)}</div><div class="m-lbl">${l}</div></div>`;}

function quarterOptions(sel){const o=['<option value="">— выбрать —</option>'];[2025,2026,2027].forEach(y=>[1,2,3,4].forEach(q=>{const v=`${y}-Q${q}`;o.push(`<option value="${v}" ${sel===v?'selected':''}>${v}</option>`);}));return o.join('');}
function strategyEditable(field,value,type='text'){const empty=value===null||value===undefined||value==='';return `<div class="strategy-editable ${empty?'empty':''}" tabindex="0" title="Дважды нажмите, чтобы изменить поле" ondblclick="openStrategyEditor(this,'${field}','${type}')">${empty?'Не заполнено':esc(value)}</div>`;}
function strategyKpiEditable(id,field,value){return `<div class="strategy-editable compact" tabindex="0" title="Дважды нажмите, чтобы изменить значение" ondblclick="openStrategyKpiEditor(this,'${id}','${field}')">${Number(value)||0}</div>`;}
function openStrategyEditor(host,field,type){if(host.classList.contains('editing'))return;const cs=CS(App.state),before=String(cs[field]??'');let control;if(type==='quarter'){control=document.createElement('select');control.innerHTML=quarterOptions(before);}else if(type==='textarea'){control=document.createElement('textarea');control.rows=4;}else{control=document.createElement('input');control.type='text';}control.className='field';if(type!=='quarter')control.value=before;host.classList.add('editing');host.replaceChildren(control);let settled=false;const cancel=()=>{if(settled)return;settled=true;renderBody();};const commit=()=>{if(settled)return;settled=true;const value=control.value;if(value===before)renderBody();else App.setStrategyField({[field]:value});};control.addEventListener('blur',commit);if(type==='quarter')control.addEventListener('change',commit);control.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel();}else if(e.key==='Enter'&&(type!=='textarea'||e.ctrlKey||e.metaKey)){e.preventDefault();commit();}});control.focus();if(control.select)control.select();}
function openStrategyKpiEditor(host,id,field){if(host.classList.contains('editing'))return;const target=CS(App.state).kpiTargets.find(x=>x.id===id);if(!target)return;const before=Number(target[field])||0,input=document.createElement('input');input.type='number';input.className='field';input.style.textAlign='right';input.value=before;host.classList.add('editing');host.replaceChildren(input);let settled=false;const cancel=()=>{if(settled)return;settled=true;renderBody();};const commit=()=>{if(settled)return;settled=true;const value=Number(input.value)||0;if(value===before)renderBody();else App.updateKpiTarget(id,{[field]:value});};input.addEventListener('blur',commit);input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel();}else if(e.key==='Enter'){e.preventDefault();commit();}});input.focus();input.select();}

function latestContactAction(s,kid){
  return s.tasks.filter(t=>t.contact_id===kid&&isActivity(t))
    .sort((a,b)=>new Date(activityDate(b)||0)-new Date(activityDate(a)||0))[0]||null;
}
function contactChannel(k){
  if(k.telegram)return 'Telegram';
  if(k.tenchat)return 'TenChat';
  if(k.email)return 'Email';
  if(k.phone)return 'Телефон';
  return k.source||'';
}
function contactExportRow(s,k){
  const c=s.companies.find(x=>x.id===k.company_id);
  const last=latestContactAction(s,k.id);
  const open=s.tasks.find(t=>t.contact_id===k.id&&(t.status==='planned'||t.status==='waiting')&&!(t.type==='custom'&&(t.title==='Отложено'||t.title==='Сигнал')))||null;
  const h=last&&last.hypothesis_id?hypById(s,last.hypothesis_id):null;
  const stage=contactStage(s,k);
  const status=k.status==='excluded'?'Исключён':(CRM_COL(stage)?.label||'Активен');
  const nextStep=stage==='deferred'?'Не определён':(open?open.title:'');
  return [
    c?c.name:(k.company_name||''),k.full_name,k.position||k.role_target||'',
    last?(last.type==='custom'?last.title:(TASK_TYPE_META[last.type]?.label||last.title)):'',fmtDshort(last&&activityDate(last)),
    (last&&last.channel)||contactChannel(k),status,nextStep,fmtDshort(open&&open.due_at),k.owner_name||last?.owner_name||'',
    h?`${h.code} · ${h.title}`:'',last&&last.result_note?last.result_note:(k.comment||'')
  ].map(v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' '));
}

function contactInfoItem(label,value,type){
  const text=String(value||'').trim();let href='';

  if(text&&type==='telegram')href=/^https?:\/\//i.test(text)?text:'https://t.me/'+text.replace(/^@/,'');
  if(text&&type==='tenchat'&&/^https?:\/\//i.test(text))href=text;
  const shown=text?(href?`<a class="link" href="${esc(href)}" ${/^https?:/i.test(href)?'target="_blank" rel="noopener"':''}>${esc(text)}</a>`:esc(text)):'<span class="faint">Не указано</span>';
  return `<div class="contact-info-item"><div class="eyebrow">${esc(label)}</div><div class="contact-info-value">${shown}</div></div>`;
}

  const xlRow=t=>{const k=s.contacts.find(x=>x.id===t.contact_id);const h=t.hypothesis_id?hypById(s,t.hypothesis_id):null;const openT=openTaskFor(s,t.company_id);
    return [companyName(s,t.company_id),k?k.full_name:'',k?(k.position||k.role_target||''):'',TASK_TYPE_META[t.type].label,
      fmtDshort(t.completed_at||t.created_at),k?(k.telegram||k.email||k.phone||k.source||''):'',STATUS_LABEL[t.status],
      openT?openT.title:'',fmtDshort(t.due_at),h?(h.code+' '+h.title):'',(t.result_note||'').replace(/[\t\n]/g,' ')];};
  const xlAll=esc([xlCols.join('\t')].concat(rows.map(t=>xlRow(t).join('\t'))).join('\n'));
  const xlTable=`<div class="panel">
      <div class="panel-head"><h2 class="panel-title">Табличный формат — для выгрузки в Google-таблицу</h2><button class="btn btn-ghost btn-xs" data-copy="${xlAll}" onclick="copyData(this)" title="Скопировать всю таблицу (TSV)">⧉ Скопировать всё</button></div>

        <thead><tr><th class="tl">${xlCols.join('</th><th>')}</th><th style="padding-right:1.15rem"></th></tr></thead>
        <tbody>${rows.map(t=>{const cells=xlRow(t);const tsv=esc(cells.join('\t'));
          return `<tr class="hoverable"><td class="tl" style="font-weight:500">${esc(cells[0])}</td>${cells.slice(1).map(c=>`<td class="muted">${esc(c||'—')}</td>`).join('')}<td class="tr" style="padding-right:1.15rem"><button class="copybtn" data-copy="${tsv}" onclick="copyData(this)" title="Скопировать строку для Google-таблицы">⧉</button></td></tr>`;}).join('')}</tbody>
      </table>${rows.length?'':emptyBox}</div></div>`;
  return `<div class="stack">
    <div class="page-head"><div><div class="eyebrow">Трекер</div><h1>Задачи</h1><p class="muted" style="font-size:.85rem;margin:.3rem 0 0">Каждая задача = компания + ЛПР + гипотеза → автотрекинг</p></div>
      <div class="seg seg-mini"><button class="${taskView==='list'?'on':''}" onclick="taskView='list';renderBody()">Список</button><button class="${taskView==='table'?'on':''}" onclick="taskView='table';renderBody()">Таблица (выгрузка)</button></div></div>
    ${filters}
    ${taskView==='table'?xlTable:listTable}
  </div>`;
}

/* --- Гипотезы --- */
const hypothesisSort={key:'priority',dir:1};
function setHypothesisSortMode(mode){if(mode==='priority_high'){hypothesisSort.key='priority';hypothesisSort.dir=1;}else if(mode==='priority_low'){hypothesisSort.key='priority';hypothesisSort.dir=-1;}else if(mode==='progress_high'){hypothesisSort.key='progress';hypothesisSort.dir=-1;}else if(mode==='progress_low'){hypothesisSort.key='progress';hypothesisSort.dir=1;}renderBody();}
function sortHypotheses(s,list){const rank={A:0,B:1,C:2};return list.slice().sort((a,b)=>{const main=hypothesisSort.key==='progress'?hypProgress(s,a)-hypProgress(s,b):(rank[a.priority]??9)-(rank[b.priority]??9);if(main)return main*hypothesisSort.dir;const byPriority=(rank[a.priority]??9)-(rank[b.priority]??9);return byPriority||String(a.code||'').localeCompare(String(b.code||''),'ru',{numeric:true,sensitivity:'base'});});}
function hypothesisSortControls(){const mode=hypothesisSort.key==='priority'?(hypothesisSort.dir===1?'priority_high':'priority_low'):(hypothesisSort.dir===-1?'progress_high':'progress_low');return `<div class="rowflex" style="gap:.35rem"><label class="eyebrow" for="hyp-sort">Сортировка</label><select id="hyp-sort" class="field auto" style="min-width:270px" onchange="setHypothesisSortMode(this.value)"><option value="priority_high" ${mode==='priority_high'?'selected':''}>Приоритет: высокий → средний → низкий</option><option value="priority_low" ${mode==='priority_low'?'selected':''}>Приоритет: низкий → средний → высокий</option><option value="progress_high" ${mode==='progress_high'?'selected':''}>Прогресс: сначала больший</option><option value="progress_low" ${mode==='progress_low'?'selected':''}>Прогресс: сначала меньший</option></select></div>`;}
function pageHypotheses(){
  const s=App.state, cs=CS(s),active=sortHypotheses(s,cs.hypotheses.filter(h=>h.status!=='archived')),archivedCount=cs.hypotheses.length-active.length;
  return `<div class="stack">
    <div class="page-head"><div><div class="eyebrow c-teal">Плоскость измерения · ${esc(cs.name)}</div><h1>Гипотезы</h1><p class="muted" style="font-size:.85rem;margin:.3rem 0 0">Гипотеза → задачи → подзадачи · факт tracked-задач считается автоматически</p></div>
      <div class="rowflex" style="justify-content:flex-end">${hypothesisSortControls()}<a href="#/hypotheses/archive" class="btn btn-ghost">Архив${archivedCount?` · ${archivedCount}`:''}</a><button class="btn btn-brass" onclick="ui.addHyp()">+ Гипотеза</button></div></div>
    <div class="stack">${active.map(h=>{
      const p=Math.round(hypProgress(s,h)*100);
      const ts=cs.hypTasks.filter(t=>t.hypothesis_id===h.id);
      const collapsed=!!App.collapsedHyps[h.id];
      const head=`<div class="hyp-head">
          <div class="rowflex" style="align-items:center"><span class="exp" onclick="App.toggleHypCollapse('${h.id}')">${collapsed?'▸':'▾'}</span><span class="readout" style="font-size:1.1rem;font-weight:700;color:var(--teal)">${esc(h.code)}</span></div>
          <div><h3 class="display" style="font-weight:600;font-size:1.05rem;cursor:pointer" onclick="App.toggleHypCollapse('${h.id}')">${esc(h.title)}</h3>${collapsed?'':`<div class="smart">SMART: ${esc(h.smart||'—')}</div>`}</div>
          <div style="text-align:right;min-width:160px">
            <div class="rowflex" style="justify-content:flex-end;margin-bottom:.4rem">${hypStatusControl(h)}${prioFull(h.priority)}</div>
            <div class="eyebrow">Метрика успеха · ${esc(h.unit)}: <b class="readout" style="color:var(--ink)">${h.plan}</b></div>
            <div class="rowflex" style="justify-content:flex-end;gap:.28rem;margin-top:.5rem"><span class="readout c-teal" style="font-size:1.3rem;font-weight:700;margin-right:.25rem">${p}%</span><span class="exp" role="button" tabindex="0" title="Редактировать гипотезу" aria-label="Редактировать гипотезу" onclick="ui.editHyp('${h.id}')">✎</span><span class="exp" role="button" tabindex="0" style="color:var(--signal)" title="Удалить гипотезу" aria-label="Удалить гипотезу" onclick="App.deleteHyp('${h.id}')">✕</span></div>
          </div></div>`;
      if(collapsed)return `<div class="panel" style="overflow:visible">${head}</div>`;
      const body=`<div class="bar" style="border-radius:0"><i style="width:${p}%"></i></div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th class="tl">Задача гипотезы</th><th>Статус</th><th>Ед.</th><th class="tr">План</th><th class="tr">Факт</th><th class="tr">Прогресс</th><th>Приоритет</th><th style="padding-right:1.15rem"></th></tr></thead>
          <tbody>${ts.map(t=>{const fact=htFact(s,t);const pl=htPlan(s,t);const eff=htStatusEffective(s,t);const pct=pl>0?Math.min(100,Math.round(fact/pl*100)):0;const expanded=!!App.expandedHt[t.id];
            const aggLabel=t.aggregation_mode==='contacts'?'ЛПР':t.aggregation_mode==='companies'?'компании':'действия';const factCell=t.mode==='tracked'?`<span class="readout" style="font-weight:600">${fact}</span> <span class="tag-auto">${aggLabel}</span>`:`<span class="readout" style="font-weight:600">${fact}</span> <span class="faint readout" style="font-size:.72rem">/ ${htSubs(s,t).length}</span>`;
            let row=`<tr class="hoverable"><td class="tl"><span class="exp" onclick="App.toggleHt('${t.id}')">${expanded?'▾':'▸'}</span><span style="font-weight:500;cursor:pointer" onclick="App.toggleHt('${t.id}')">${esc(t.title)}</span></td>
              <td><span class="chip ${HT_STATUS_CHIP[eff]}">${HT_STATUS_LABEL[eff]}</span></td><td class="faint readout">${esc(t.unit)}</td><td class="tr readout">${pl}</td><td class="tr">${factCell}</td>
              <td class="tr" style="min-width:96px"><div class="rowflex" style="justify-content:flex-end;gap:.4rem"><div class="bar ${pct>=100?'complete':''}" style="width:52px"><i style="width:${pct}%"></i></div><span class="readout faint" style="font-size:.72rem">${pct}%</span></div></td>
              <td>${prio(t.priority)}</td><td class="tr" style="padding-right:1.15rem;white-space:nowrap"><span class="exp" title="Редактировать задачу" onclick="ui.editTask('${t.id}')">✎</span><span class="exp" style="color:var(--signal)" title="Удалить задачу" onclick="App.deleteHypTask('${t.id}')">✕</span></td></tr>`;
            if(expanded){let inner;
              if(t.mode==='tracked'){const csx=htContrib(s,t);inner=csx.length?csx.map(x=>`<div class="contrib"><b>✓</b> ${esc(x.title)} · ${esc(companyName(s,x.company_id))}${x.contact_id?' · '+esc(contactName(s,x.contact_id)||''):''} · ${fmtD(x.completed_at)}</div>`).join(''):'<span class="faint" style="font-size:.78rem">Пока нет засчитанных действий. Завершайте касания/встречи с привязкой к этой задаче — факт наберётся сам.</span>';}
              else{const subs=htSubs(s,t);inner=`<div class="subwrap">${subs.map(x=>`<span class="subchip ${x.is_done?'done':''}"><span onclick="App.toggleSubtask('${x.id}')" style="cursor:pointer">${x.is_done?'☑':'☐'} ${esc(x.title)}</span><span class="del" onclick="App.deleteSubtask('${x.id}')" style="cursor:pointer">✕</span></span>`).join('')}<button class="tinyadd" onclick="ui.addSub('${t.id}')">+ Подзадача</button></div>`;}
              row+=`<tr class="subrow"><td colspan="8">${inner}</td></tr>`;}
            return row;}).join('')}
            <tr><td colspan="8" class="tl" style="padding-top:.6rem;padding-bottom:.9rem"><button class="tinyadd" onclick="ui.addTask('${h.id}')">+ Задача гипотезы</button></td></tr>
          </tbody></table></div>`;
      return `<div class="panel" style="overflow:visible">${head}${body}</div>`;
    }).join('')||'<div class="panel"><div style="padding:2rem;text-align:center" class="faint">В этой стратегии пока нет гипотез. Нажмите «+ Гипотеза» или загрузите стратегию.</div></div>'}</div>
  </div>`;
}

          const aggLabel=t.aggregation_mode==='contacts'?'ЛПР':t.aggregation_mode==='companies'?'компании':'действия',factCell=t.mode==='tracked'?`<span class="readout" style="font-weight:600">${fact}</span> <span class="tag-auto">${aggLabel}</span>`:`<span class="readout" style="font-weight:600">${fact}</span> <span class="faint readout" style="font-size:.72rem">/ ${htSubs(s,t).length}</span>`;

            <td><span class="chip ${HT_STATUS_CHIP[eff]}">${HT_STATUS_LABEL[eff]}</span></td><td class="faint readout">${esc(t.unit)}</td><td class="tr readout">${pl}</td><td class="tr">${factCell}</td>
            <td class="tr" style="min-width:96px"><div class="rowflex" style="justify-content:flex-end;gap:.4rem"><div class="bar ${pct>=100?'complete':''}" style="width:52px"><i style="width:${pct}%"></i></div><span class="readout faint" style="font-size:.72rem">${pct}%</span></div></td><td>${prio(t.priority)}</td></tr>`;
          if(expanded){let inner;

  return `<div class="stack"><div class="page-head"><div><div class="eyebrow">Гипотезы · архив</div><h1>Архив гипотез</h1><p class="muted" style="font-size:.85rem;margin:.3rem 0 0">Архивные гипотезы не участвуют в рабочем фокусе, но полностью сохраняют задачи, прогресс и историю.</p></div><a href="#/hypotheses" class="btn btn-ghost">← Вернуться к гипотезам</a></div><div class="archive-hero"><div class="eyebrow">Сохранённый контекст</div><h2>Результаты прошлой работы остаются доступными для просмотра.</h2><div class="faint" style="font-size:.78rem;margin-top:.35rem">Раскройте гипотезу или отдельную задачу. Чтобы снова редактировать её, верните гипотезу в рабочий статус.</div></div><div class="stack">${cards||'<div class="panel"><div class="kempty" style="padding:2rem">Архив пуст</div></div>'}</div></div>`;

/* ============================ МОДАЛКИ ============================ */
function optContacts(companyId,sel){const s=App.state;const list=s.contacts.filter(k=>k.company_id===companyId&&k.status==='active');
  return `<option value="">— выбрать ЛПР —</option>`+list.map(k=>`<option value="${k.id}" ${sel===k.id?'selected':''}>${esc(k.full_name)} · ${esc(k.position||k.role_target)}</option>`).join('');}
function optHyps(sel){const s=App.state;return `<option value="">— без гипотезы —</option>`+CS(s).hypotheses.filter(h=>h.status!=='archived').map(h=>`<option value="${h.id}" ${sel===h.id?'selected':''}>${esc(h.code)} · ${esc(h.title)}</option>`).join('');}
function optHypTasks(hypId,sel){const s=App.state;if(!hypId)return `<option value="">— сначала выберите гипотезу —</option>`;
  const list=allHtasks(s).filter(t=>t.hypothesis_id===hypId);return `<option value="">— задача гипотезы (необязательно) —</option>`+list.map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${esc(t.title)}</option>`).join('');}
function stepFields(prefix,companyId,presetContact){
  const typeOpts=NEXT_STEP_TYPES.map(x=>`<option value="${x}">${TASK_TYPE_META[x].label}${TASK_TYPE_META[x].metric?' · +1 к метрике':''}</option>`).join('');
  return `<div><label class="lbl eyebrow">Название шага</label><input id="${prefix}-title" class="field" placeholder="Что именно делаем"></div>
    <div class="grid g2 mrow"><div><label class="lbl eyebrow">Тип шага</label><select id="${prefix}-type" class="field">${typeOpts}</select></div><div><label class="lbl eyebrow">ЛПР (с кем идём)</label><select id="${prefix}-contact" class="field">${optContacts(companyId,presetContact)}</select></div></div>
    <div class="grid g2 mrow"><div><label class="lbl eyebrow">Гипотеза</label><select id="${prefix}-hyp" class="field" onchange="ui._fillHT('${prefix}',this.value)">${optHyps('')}</select></div><div><label class="lbl eyebrow">Задача гипотезы</label><select id="${prefix}-htask" class="field">${optHypTasks('','')}</select></div></div>
    <div class="grid g2 mrow"><div><label class="lbl eyebrow">Дедлайн</label><input id="${prefix}-due" type="date" class="field"></div><div></div></div>`;
}
const ui={
  _fillHT(prefix,hypId){document.getElementById(prefix+'-htask').innerHTML=optHypTasks(hypId,'');},
  _readStep(prefix){return {type:document.getElementById(prefix+'-type').value,contactId:document.getElementById(prefix+'-contact').value||null,hypId:document.getElementById(prefix+'-hyp').value||null,hypTaskId:document.getElementById(prefix+'-htask').value||null,title:document.getElementById(prefix+'-title').value,due:(v=>v?new Date(v).toISOString():null)(document.getElementById(prefix+'-due').value)};},
  complete(taskId){const s=App.state,t=s.tasks.find(x=>x.id===taskId); if(!t)return;const hasContact=!!t.contact_id;const kn=hasContact?contactName(s,t.contact_id):null;
    App.openModal(`<div class="panel modal"><div class="modal-head"><h3>Завершить: ${esc(t.title)}</h3><button class="x" title="Закрыть" onclick="App.cancelModal()">✕</button></div>
      <div><div><label class="lbl eyebrow">Результат</label><textarea id="m-note" class="field" rows="2" placeholder="«Хорошо пообщались, запросили КП»…"></textarea></div>
        <div class="seg mrow"><button id="seg-next" class="on next" onclick="ui._mode('next')">Назначить следующий шаг</button><button id="seg-exc" onclick="ui._mode('exclude')">${hasContact?'Исключить ЛПР':'Исключить компанию'}</button></div>
        <div id="m-next" class="mrow">${stepFields('m',t.company_id,t.contact_id)}</div>
        <div id="m-exc" style="display:none" class="mrow"><label class="lbl eyebrow">${hasContact?('Причина исключить ЛПР'+(kn?' · '+esc(kn):'')):'Причина исключить компанию'}</label><input id="m-reason" class="field" placeholder="Не наш профиль / нет бюджета…"></div>
        <div class="faint" style="font-size:.72rem;margin-top:.8rem">Окно закрывается только кнопками. «Завершить без шага» — компания останется «без следующего шага» и всплывёт в «Фокусе».</div></div>
      <div class="end"><button class="btn btn-ghost" onclick="App.cancelModal()">Отмена</button><button class="btn btn-ghost" onclick="ui._completeNoStep('${taskId}')">Завершить без шага</button><button id="m-submit" class="btn btn-primary" onclick="ui._submitComplete('${taskId}')">Завершить и назначить шаг</button></div>
    </div>`);},
  _completeNoStep(taskId){const el=document.getElementById('m-note');const note=el?el.value:'';App.completeTask(taskId,note);App.closeModal();},
  _mode(m){document.getElementById('seg-next').classList.toggle('on',m==='next');document.getElementById('seg-exc').classList.toggle('on',m==='exclude');document.getElementById('m-next').style.display=m==='next'?'':'none';document.getElementById('m-exc').style.display=m==='exclude'?'':'none';const b=document.getElementById('m-submit');b.textContent=m==='exclude'?'Завершить и исключить':'Завершить и назначить шаг';b.className='btn '+(m==='exclude'?'btn-signal':'btn-primary');ui._m=m;},
  _submitComplete(taskId){const s=App.state,t=s.tasks.find(x=>x.id===taskId);const note=document.getElementById('m-note').value;App._onDismiss=null;
    if(ui._m==='exclude'){const reason=document.getElementById('m-reason').value;App.completeTask(taskId,note);if(t.contact_id)App.excludeContact(t.contact_id,reason);else App.excludeCompany(t.company_id,reason);}else{App.completeTask(taskId,note,ui._readStep('m'));}App.closeModal();},

    else cards=stageContacts.map(k=>crmContactCard(s,k)).join('');
    const n=col.id==='signal'?signalCompanies.length+signalContacts.length:stageContacts.length;
    const add=col.id==='signal'?`<button class="kcol-plus" title="Добавить компанию" aria-label="Добавить компанию" onclick="ui.addCompany()">+</button>`:['touch','meeting','deal','won'].includes(col.id)?`<button class="kcol-plus" title="Добавить вручную в этап «${esc(col.label)}»" aria-label="Добавить вручную" onclick="openManualCrmAdd('${col.id}')">+</button>`:'';
    return `<div class="kcol" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="crmDrop(event,'${col.id}')">

  }).join('');
  return `<div class="stack crm-page"><div class="page-head"><div><div class="eyebrow">Воронка ЛПР</div><h1>CRM</h1><p class="muted" style="font-size:.85rem;margin:.3rem 0 0">Карточка = текущее состояние · действие фиксируется кнопкой · перенос не влияет на статистику</p></div><div class="rowflex"><div class="seg seg-mini"><button class="${crmView==='board'?'on':''}" onclick="setCrmView('board')">Канбан</button><button class="${crmView==='table'?'on':''}" onclick="setCrmView('table')">Таблица</button></div><a class="btn btn-ghost btn-sm" href="#/crm/rejected">Отклонённые сигналы</a><a class="btn btn-ghost btn-sm" href="#/crm/archive">Архив действий</a></div></div>
    ${crmView==='table'?crmTableView(s):`<div class="kboard crm-board">${cols}</div>`}</div>`;
}

        <div class="board-card-meta"><span class="board-card-date ${ds.key==='overdue'?'overdue':''}">${fmtCardDate(date)}</span>${prio(t.priority||'B')}</div></div>`;}).join('');
    return `<div class="kcol" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="boardDrop(event,'${col.id}')">
      <div class="kcol-h"><span class="kcol-title"><span>${col.label}</span><span class="kcol-c">${list.length}</span></span>${col.id==='new'?'<button class="kcol-plus" title="Добавить задачу" aria-label="Добавить задачу" onclick="openBoardAdd()">+</button>':''}</div>
      <div class="kcol-body">${cards||'<div class="kempty">пусто</div>'}</div></div>`;
  }).join('');
  return `<div class="stack"><div class="page-head"><div><div class="eyebrow">Исполнение</div><h1>Задачи</h1><p class="muted" style="font-size:.85rem;margin:.3rem 0 0">Интервал дат подсказывает, когда пора приступать; статус меняет пользователь</p></div><div class="rowflex"><a href="#/tasks/archive" class="btn btn-ghost btn-sm">Архив выполненного</a></div></div>
    <div class="kboard kboard4">${cols}</div></div>`;
}
function openBoardAdd(){App.openModal(`<div class="panel modal"><div class="modal-head"><h3>Новая задача</h3><button class="x" onclick="App.closeModal()">✕</button></div>
    <div><label class="lbl eyebrow">Название</label><input id="bt-title" class="field" placeholder="Что нужно сделать"></div>
    <div class="grid g2 mrow"><div><label class="lbl eyebrow">Гипотеза</label><select id="bt-hyp" class="field" onchange="btFillHT(this.value)">${optHyps('')}</select></div><div><label class="lbl eyebrow">Главная задача (задача гипотезы)</label><select id="bt-htask" class="field">${optHypTasks('','')}</select></div></div>
    <div class="grid g4 mrow"><div><label class="lbl eyebrow">Начать с</label><input id="bt-start" type="date" class="field"></div><div><label class="lbl eyebrow">Завершить до</label><input id="bt-due" type="date" class="field"></div><div><label class="lbl eyebrow">Ответственный</label><input id="bt-owner" class="field" value="Я"></div><div><label class="lbl eyebrow">Приоритет</label><select id="bt-priority" class="field"><option value="A">${prioOptionLabel('A')}</option><option value="B" selected>${prioOptionLabel('B')}</option><option value="C">${prioOptionLabel('C')}</option></select></div></div>
    <div class="end"><button class="btn btn-ghost" onclick="App.closeModal()">Отмена</button><button class="btn btn-primary" onclick="submitBoardAdd(event)">Создать</button></div></div>`);}
function btFillHT(h){const el=document.getElementById('bt-htask');if(el)el.innerHTML=optHypTasks(h,'');}
async function submitBoardAdd(e){const t=document.getElementById('bt-title').value;if(!t)return;const st=document.getElementById('bt-start').value,dd=document.getElementById('bt-due').value;if(st&&dd&&st>dd){toast('Дата начала не может быть позже дедлайна');return;}const btn=e?.currentTarget;if(btn){btn.disabled=true;btn.textContent='Сохраняю…';}try{await App.addBoardTask({title:t,hypId:document.getElementById('bt-hyp').value||null,hypTaskId:document.getElementById('bt-htask').value||null,start:toIsoDate(st),due:toIsoDate(dd,true),owner:document.getElementById('bt-owner').value||'Я',priority:document.getElementById('bt-priority').value});App.closeModal();toast('Задача сохранена в базе');}catch(err){if(btn){btn.disabled=false;btn.textContent='Создать';}syncBadge('err');toast('Не удалось сохранить задачу: '+(err.message||err));}}
function boardDragStart(e,id){_boardDrag=id;e.dataTransfer.effectAllowed='move';}
function boardDrop(e,status){e.preventDefault();document.querySelectorAll('.kcol.drop').forEach(x=>x.classList.remove('drop'));if(!_boardDrag)return;const id=_boardDrag;_boardDrag=null;App.moveBoardTask(id,status);}

function bodyHtml(){
  const h=location.hash||'#/';
  if(h==='#/'||h==='')return pageDashboard();
  if(h==='#/strategy')return pageStrategy();
  if(h==='#/hypotheses/archive')return pageHypothesisArchive();
  if(h==='#/hypotheses')return pageHypotheses();
  if(h==='#/crm/archive')return pageCrmArchive();
  if(h==='#/crm/rejected')return pageRejectedArchive();
  if(h==='#/crm')return pageCRM();
  if(h==='#/signals')return pageCRM();
  if(h==='#/companies')return pageCompanies();
  if(h.startsWith('#/companies/'))return pageCompany(h.split('/')[2]);
  if(h.startsWith('#/contacts/'))return pageContact(h.split('/')[2]);
  if(h==='#/contacts')return pageContacts();
  if(h==='#/tasks/archive')return pageTaskArchive();
  if(h==='#/tasks')return pageBoard();
  return pageDashboard();
}
function renderBody(){document.getElementById('page-body').innerHTML=bodyHtml();decorateCrmTableIdleAlerts();}
function render(){document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<main class="main"><div class="main-inner" id="page-body">${bodyHtml()}</div></main></div>`;decorateCrmTableIdleAlerts();}
function renderModal(){document.getElementById('modal-root').innerHTML=App.modal?`<div class="overlay">${App.modal}</div>`:'';}
window.addEventListener('hashchange',()=>{App.compTab='dossier';const mn=document.querySelector('.main');if(mn)mn.scrollTop=0;render();});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&App.modal)App.cancelModal();});
document.addEventListener('toggle',e=>{if(!e.target.matches?.('.hyp-status[open]'))return;document.querySelectorAll('.hyp-status[open]').forEach(x=>{if(x!==e.target)x.removeAttribute('open');});},true);
document.addEventListener('click',e=>{document.querySelectorAll('.hyp-status[open]').forEach(x=>{if(!x.contains(e.target))x.removeAttribute('open');});});
document.getElementById('fileExcel').addEventListener('change',function(){if(this.files[0])handleExcelFile(this.files[0]);this.value='';});
boot();
</script>
</body>
</html>
